<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>42-parallax</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body {
            main {
                section {
                    figure.parallax {
                        outline: 4px solid red;
                        margin: 0;
                        overflow: hidden;
                        width: 100%;
                        position: relative;
                        height: 576px;

                        div.layer8,
                        div.layer7,
                        div.layer6,
                        div.layer5,
                        div.layer4,
                        div.layer3,
                        div.layer2,
                        div.layer1 {
                            position: absolute;
                            top: 0;
                            left: 0;
                            height: 576px;
                            width: 100%;
                            
                        }
                    
                        

                        div.layer8 {
                            background: url(../src/image/parallax/layer_08.png) repeat-x 0;

                            animation: 30s animLayer infinite linear ;
                        }

                        div.layer7 {
                            background: url(../src/image/parallax/layer_07.png) repeat-x 0;
                            animation: 25s animLayer infinite linear ;
                        }
                        div.layer6 {
                            background: url(../src/image/parallax/layer_06.png) repeat-x 0;
                            animation: 20s animLayer infinite linear ;
                        }
                        div.layer5 {
                            background: url(../src/image/parallax/layer_05.png) repeat-x 0;
                            animation: 15s animLayer infinite linear ;
                        }
                        div.layer4 {
                            background: url(../src/image/parallax/layer_04.png) repeat-x 0;
                            animation: 10s animLayer infinite linear ;
                        }
                        div.layer3 {
                            background: url(../src/image/parallax/layer_03.png) repeat-x 0;
                            animation: 5s animLayer infinite linear ;
                        }
                        div.layer2 {
                            background: url(../src/image/parallax/layer_02.png) repeat-x 0;
                            animation: 2.5s animLayer infinite linear ;
                        }
                        div.layer1 {
                            background: url(../src/image/parallax/layer_01.png) repeat-x 0;
                            animation: 1s animLayer infinite linear ;
                        }
                        div.runner {
                            background:url(/src/image/parallax/running.gif) no-repeat center/cover;
                            position:absolute;
                            bottom: 7rem;
                            left: 8rem;
                            height: 100px;
                            width:100px;
                        }

                    }

                }
            }
        }
        @keyframes animLayer {
            100% { background-position-x: calc(-1024px);}
        }
        @media (min-width: 1044px) {
            body {
                main {
                    width: 1044px;
                    section {
                        width: 1024px;
                        figure.parallax {
                            div.runner {
                                left: 30rem;
                            }
                        }
                    }
                }
            }
        }
    </style>
</head>
    <body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff9" viewBox="0 0 256 256"><path d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>42-parallax</h1>
            <img src="../src/image/logo-css.png" alt="css">
            <h3>Move at a different speed the backgrounds.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example Runner:</h3>


            <figure class="parallax">
                <div class="layer8"></div>
                <div class="layer7"></div>
                <div class="layer6"></div>
                <div class="layer5"></div>
                <div class="layer4"></div>
                <div class="layer3"></div>
                <div class="layer2"></div>
                <div class="layer1"></div>
                <div class="runner"></div>
            </figure>
        </section>
    </main>
  </body>
</html>
