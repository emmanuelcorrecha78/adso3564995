	<style>
div.gallery-1 {
		div {
        border: 3px solid #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px #0005;
    
    }
  display: grid;
  grid-template-areas:  "one two three"
                        "four two five"
						"six six seven";
  grid-gap: 0.2rem;
  margin: 4rem auto;
  width: 300px;
  
  div {
    background-color: #f00;
    height: 100px;
    width: 100px;
	

	img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    
    &:first-child {
      background-color: #00f;
      grid-area: six;
      width: calc(200px + 0.2rem);
    }
    &:nth-child(2) {
      grid-area: one;
    }
    &:nth-child(3) {
      grid-area: three;
    }
    &:nth-child(4) {
      background-color: #00f;
      grid-area: two;
      height: calc(200px + 0.2rem);
    }
    &:nth-child(5) {
      grid-area: five;
    }
    &:last-child(6) {
      grid-area: four;
    }
  }
}

div.gallery-2 {
		div {
        border: 3px solid #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px #0005;
    
    }
    display: grid;

    grid-template-areas:
        "two two three four"
        "two two five five"
        "one six five five";

    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);

    gap: 0.1rem;
    margin: 2rem auto;
    width: max-content;

    div {
        background-color: #f00;

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        &:first-child {
            background-color: #00f;
            grid-area: one;
        }

        &:nth-child(2) {
            grid-area: two;
        }

        &:nth-child(3) {
            grid-area: three;
        }

        &:nth-child(4) {
            grid-area: four;
        }

        &:nth-child(5) {
            grid-area: five;
        }

        &:last-child() {
        grid-area: six;
        }
    }
}

	</style>
