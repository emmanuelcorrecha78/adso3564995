<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.clip {
                background: url(/src/image/pittsburgh.jpg) no-repeat center / cover;

                margin: 2rem auto;
                height: 240px;
                width: 340px;
                transition: all 0.5s ease;

                &.clip1 {
                    clip-path: circle(25%);

                    &.hover {
                        clip-path: cicle(100%);
                    }
                }

                &.clip2 {
                    clip-path: polygon(0% 15%, 15% 15%, 15% 0%, 85% 0%, 85% 15%, 100% 15%, 100% 85%, 85% 85%, 85% 100%, 15% 100%, 15% 85%, 0% 85%);
                
                    
                }
            }
        }
    </style>
</head>
