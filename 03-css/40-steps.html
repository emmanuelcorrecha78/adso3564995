<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        :root {
            --size: 256px;
        }
        body {
            overflow-y: hidden;
        }
        section {
            div.bg {
                background: url(/src/image/bg-steps.png)
                            no-repeat center / cover;
                outline: 4px solid #fff;
                border-radius: 12px;
                corner-shape: squircle;
                position: relative;
                height: 500px;

                div.instructions {
                    background: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    text-align: center;
                    outline: 4px solid #fff;
                    padding: 0.4rem;
                    position: absolute;
                    top: 26px;
                    left: 26px;
                    width: 300px;
                }

                div.trainer {
                    background: url(/src/image/steps-all.png)
                                no-repeat;
                    background-position-x: 0;
                    transform: scale(.8);
                    position: absolute;
                    bottom: 0px;
                    left: 50px;
                    height: var(--size);
                    width: var(--size);

                    animation: 0.6s animTrainer steps(4) infinite;

                    &.front { background-position-y: calc(var(--size)*0); }
                    &.left  { background-position-y: calc(var(--size)*-1); }
                    &.right { background-position-y: calc(var(--size)*-2); }
                    &.back  { background-position-y: calc(var(--size)*-3); }
                }
            }
        }

        @keyframes animTrainer {
            100% { background-position-x: calc(var(--size) * -4); }
        }
    </style>
    </style>
</head>
    <body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff9" viewBox="0 0 256 256"><path d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>40-steps</h1>
            <img src="../src/image/logo-css.png" alt="css">
            <h3>Allows step-by-step animation of a sprite.</h3>
        </header>
        <section>
            <h3 class="subtitle">subtitle</h3>
             <div class="bg">
                <div class="instructions">
                    Please press arrow keys: 
                    <br>
                    &larr; &uarr; &rarr; &darr; 
                </div>
                <div class="trainer front"></div>
            </div>
        </section>
    </main>
 <script>
        const trainer = document.querySelector('.trainer');
        document.addEventListener('keyup', function(e) {
            switch (e.keyCode) {
                case 37: // Left
                    trainer.classList.remove('front', 'right', 'back');
                    trainer.classList.add('left');
                    break;
                case 38: // Front
                    trainer.classList.remove('left', 'right', 'back');
                    trainer.classList.add('front');
                    break;
                case 39: // Right
                    trainer.classList.remove('left', 'front', 'back');
                    trainer.classList.add('right');
                    break;
                case 40: // Back
                    trainer.classList.remove('left', 'front', 'right');
                    trainer.classList.add('back');
                    break;
            }
        });
    </script>
  </body>
</html>
