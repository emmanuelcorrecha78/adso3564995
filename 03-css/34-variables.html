<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>34-variables</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        :root {
            --btn-width: 320px;
            --btn-padding: 0.4rem 0.8rem;
            --primary-color: #3a91ee;
            --secundary-color: #727e8a;
            --primary-border: 4px solid #a3cfff;
            --secundary-border: 4px solid #c5d1dc;
        }
        section.btn {
            border-radius: 8px;
            corner-shape: squircle;
            color: #fff;
            display: block;
            margin: 0.4rem auto;
            padding: var(--btn-padding);
            width: var(--btn-width);

            &.btn1 {
                background: var(--primary-color);
                border: var(--primary-border);
            }
            &.btn2 {
                background: var(--secundary-color);
                border: var(--secundary-border);
            }
        }
    </style>
</head>
