<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
        img.filter {
            background: linear-gradient(45deg, white 50%, gray);
            border-radius: 14px;
            corner-shape: squircle;
            width: 140px;
            display: block;
            margin: 2rem auto;   
            transition: all is ease;
            
            &.filter1 {
                filter: grayscale(1);

            }
            &.filter2 { 
                filter: blur(8px);
            }
            &.filter3 {
                filter: sepia(1);

            }
            &.filter4 {
                filter: Brightness(.5);


            }
            &.filter5 {
                filter: invert();

            }
            &.filter6 {
                filter: drop-shadow(0 0 12px white);

            }
            &.filter7 {
                filter: hue-rotate(300deg);

            }
            &.hover {
                filter: none;

            }
            
        }
    }
    </style>
</head>
