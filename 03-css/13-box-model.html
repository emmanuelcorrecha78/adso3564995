    <style>
        div.box {
            background: #fff url(/src/image/box-model.png)
                        no-repeat center /contain;

            /* Border: */

            /* LongWay: Width */
            border-top-width: 4px;
            border-right-width: 4px;
            border-bottom-width: 4px;
            border-left-width: 4px;
            /* ShortHand: Width */
            border-width: 4px;

            /* LongWay: Style */
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            /* ShortHand: Style */
            border-style: solid;

            /* LongWay: Color */
            border-top-color: #caa0f5;
            border-right-color: #caa0f5;
            border-bottom-color: #caa0f5;
            border-left-color: #caa0f5;
            /* ShortHand: Color */
            border-color: #caa0f5;

            /* ShortHand: Border */
            border: 4px solid #caa0f5;

            /* LongWay: Padding */
            padding-top: 0.6rem;
            padding-right: 0.6rem;
            padding-bottom: 0.6rem;
            padding-left: 0.6rem;

            /* ShortHand: Padding */
            padding: 0.6rem; /* Top, Right, Bottom, Left */

            height: 200px;
            margin: 2rem auto;
            width: 300px;
        }
    </style>
</head>
